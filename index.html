<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gere aqui a sua senha forte</h1>

        <div class="linha">
            <label for="quantidade">Caracteres (mínimo 8):</label>
            <input type="number" id="quantidade" value="8" min="8">
        </div>

        <div class="linha">
            <button onclick="gerarSenha()">Gerar senha</button>
            <input type="text" id="senha" placeholder="Senha" readonly>
            <button onclick="copiar()">Copiar</button>
        </div>

        <div id="mensagem"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
